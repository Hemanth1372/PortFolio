<!DOCTYPE html>
<html>
    <head>
        <title>Sign Up</title>
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="main-content">
            <div class="login">
                <input type="email" placeholder="Email address" class="email" onKeyDown="handle(event)">
                <input type="password" placeholder="Create Password" class="password" onKeyDown="handle(event)">
                <input type="password" placeholder="Rewrite Password" class="password" onKeyDown="handle(event)">
                <button type="submit" onclick="checkUser()">Signup</button>
                <p class="status right-credentials wrong-credentials"></p>
                <p style="text-align: center; font-size: 1.2rem; 
                padding: 0; margin: 0"><a href="./index.html">Back to Login Page</a></p>
            </div>
        </div>
        <script src="./signup.js"></script>
    </body>
</html>
